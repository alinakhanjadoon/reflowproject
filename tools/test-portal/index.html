<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReFlow Test Portal</title>
<style>
:root{--navy:#14213d;--navy2:#1d2f55;--blue:#2563eb;--bg:#f3f5f9;--card:#fff;--line:#e2e6ee;--text:#1b2433;--muted:#6b7589;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--blue)}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}h3{margin:0;font-size:15px}
.muted{color:var(--muted)}
.shell{display:flex;min-height:100vh}
.side{width:220px;background:var(--navy);color:#fff;padding:18px 0;flex:none}
.brand{font-weight:700;font-size:16px;padding:0 20px 18px;border-bottom:1px solid #ffffff22;margin-bottom:10px}
.side nav a{display:block;padding:9px 20px;color:#c9d3ea;text-decoration:none;border-left:3px solid transparent}
.side nav a:hover{background:var(--navy2);color:#fff}
.side nav a[aria-current=page]{background:var(--navy2);color:#fff;border-left-color:#60a5fa}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
#content{padding:22px 24px 60px}
.btn{display:inline-block;padding:6px 11px;border:1px solid #c5ccda;border-radius:6px;background:#fff;color:var(--text);font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#f1f4fa}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1d4ed8}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font-size:24px;margin-top:2px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select{font:inherit;padding:6px 8px;border:1px solid #c5ccda;border-radius:6px;background:#fff;min-width:0;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1 1 150px}
.crow{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1.2fr;gap:8px;margin-top:8px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table.grid{border-collapse:collapse;width:100%}
.grid th,.grid td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.grid thead th{background:#f7f9fc;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.grid thead a{color:inherit;text-decoration:none}.grid tbody tr:hover{background:#fafbfe}
td.num,th.num{text-align:right}.acts{display:flex;gap:6px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e8ecf4;color:#445}
.badge.Pending{background:#fef3c7;color:var(--warn)}.badge.Paid{background:#dcfce7;color:var(--ok)}.badge.Overdue{background:#fee2e2;color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .top2{display:flex;justify-content:space-between;align-items:center}.card .amt{font-size:20px;font-weight:700;min-height:28px}
.ilist{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:10px}
.ilist li{display:flex;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.ilist li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vscroll{height:420px;overflow:auto;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff}
#vinner{position:relative;border:0;border-radius:0}#vinner li{border-bottom:1px solid var(--line);position:absolute}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;flex-wrap:wrap}
.login{max-width:380px;margin:9vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}
.login .brand{color:var(--navy);border:0;padding:0 0 4px;font-size:20px}.login .field{margin:12px 0}
.err{background:#fee2e2;color:var(--bad);padding:8px 10px;border-radius:6px;margin:10px 0}.okmsg{background:#dcfce7;color:var(--ok);padding:8px 10px;border-radius:6px;margin:10px 0}
.hint{background:#eff6ff;border-radius:6px;padding:8px 10px;margin-top:14px;font-size:12px;color:#334}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;overflow-wrap:anywhere}
.switch{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.switch input{margin-top:4px;width:18px;height:18px}
.switch b{display:block}.tag{font-size:12px;background:#eef2ff;color:#3730a3;border-radius:5px;padding:1px 6px}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:380px;z-index:50}
.toast.show{opacity:1}.toast.error{background:var(--bad)}
.dlg{border:2px solid var(--bad);background:#fff;border-radius:10px;padding:14px;margin:12px 0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sel{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--text);margin:0}
@media(max-width:800px){.side{width:150px}.crow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function () {
'use strict';

/* ---------- storage ---------- */
var KEY = 'rtp_state_v1', SESSION = 'rtp_session';
var mem = {};
var ls = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};

/* ---------- helpers ---------- */
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var money = function (v) { return v == null ? '' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
var dash = function (v) { return v ? esc(v) : '<span class="muted">—</span>'; };
var Q = function () { return new URLSearchParams(location.search); };
function href(o) { var q = Q(); for (var k in o) { if (o[k] == null || o[k] === '') q.delete(k); else q.set(k, o[k]); } return '?' + q.toString(); }
function ts(iso) { var d = new Date(iso), p = function (n, l) { return String(n).padStart(l || 2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + p(d.getMilliseconds(), 3); }
function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
var pad = function (n, l) { return String(n).padStart(l || 3, '0'); };

/* ---------- seed data ---------- */
var PM = ['Bank Transfer', 'Credit Card', 'Cheque', 'Cash', 'ACH'];
var DESC = ['Monthly supply of office materials', 'Quarterly logistics services', 'Wholesale goods order', 'Maintenance and support contract', 'Retail stock replenishment'];
var LONG = 'Annual master services agreement covering warehouse operations, inbound and outbound freight coordination, quality inspection, packaging and labelling, returns processing, seasonal labour surcharge, fuel adjustments, customs documentation, insurance cover for goods in transit, storage fees for pallets held beyond the agreed period, and a one-off onboarding fee for the new regional distribution centre. Payment is due within thirty days of the invoice date; late payments incur interest as set out in clause 14 of the agreement.';
var SPECIAL = 'O\'Brien & Sons, "Fine" <Goods> Café Ltd. #9';

function inv(n, customer, status, amount, o) {
  var r = { id: 'INV-' + pad(n), customer: customer, status: status, amount: amount, type: 'Invoice',
    invoiceDate: addDays('2026-08-01', n * 3), dueDate: addDays('2026-08-31', n * 3),
    method: PM[n % PM.length], description: DESC[n % DESC.length] };
  if (o) for (var k in o) r[k] = o[k];
  return r;
}
var TEN = [[1, 'ABC Supplies', 'Pending', 1500], [2, 'Global Traders', 'Paid', 2500], [3, 'City Wholesale', 'Pending', 500], [4, 'Metro Services', 'Pending', 3500], [5, 'Prime Distribution', 'Overdue', 1800], [6, 'Alpha Stores', 'Paid', 4200], [7, 'North Logistics', 'Pending', 2100], [8, 'Westside Retail', 'Pending', 800], [9, 'Eastern Traders', 'Overdue', 5200], [10, 'Central Supplies', 'Paid', 1100]];
var EXTRA = [[11, 'Harbor Foods', 'Pending', 950], [12, 'Summit Hardware', 'Paid', 3300, { type: 'Credit Note' }], [13, 'Lakeside Pharma', 'Overdue', 2750], [14, 'Pioneer Electric', 'Pending', 1250], [15, 'Redwood Timber', 'Paid', 6100, { type: 'Statement' }], [16, 'Bluebird Cafe Supply', 'Pending', 420], [17, 'Crescent Textiles', 'Overdue', 3900, { type: 'Credit Note' }], [18, 'Falcon Freight', 'Paid', 2200], [19, 'Orchid Wellness', 'Pending', 1750], [20, 'Granite Builders', 'Pending', 7800, { type: 'Statement' }], [21, 'Maple Office Mart', 'Paid', 640], [22, 'Nova Tech Parts', 'Overdue', 1320, { type: 'Credit Note' }], [23, 'Sterling Print Works', 'Pending', 2600], [24, 'Zenith Cleaning Co', 'Paid', 980]];
var mkList = function (arr) { return arr.map(function (a) { return inv(a[0], a[1], a[2], a[3], a[4]); }); };

var COND = [['C01', 'Pending', 1500], ['C02', 'Pending', 500], ['C03', 'Overdue', 2200], ['C04', 'Paid', 3000], ['C05', 'Pending', 1000], ['C06', 'Pending', 1001], ['C07', 'Overdue', 900], ['C08', 'Paid', 800], ['C09', 'Pending', 4800], ['C10', 'Overdue', 1000], ['C11', 'Paid', 1000], ['C12', 'Pending', 250]];
var CUST2 = ['Aurora Metals', 'Birch Lane Grocers', 'Cobalt Systems', 'Dune Outfitters', 'Evergreen Farms', 'Fjord Marine', 'Gulf Coast Paper', 'Hilltop Garage', 'Iris Boutique', 'Juniper Labs', 'Kestrel Air', 'Lumen Lighting'];

var PRESETS = {
  seed: { name: 'Default seed — 24 invoices', purpose: 'Initial state. Mixed statuses, three document types.', build: function () { return mkList(TEN.concat(EXTRA)); } },
  A: { name: 'Preset A — Five Invoices', purpose: 'Basic looping test (INV-001 … INV-005).', build: function () { return mkList(TEN.slice(0, 5)); } },
  B: { name: 'Preset B — Ten Invoices', purpose: 'Multiple-record processing, mixed statuses (INV-001 … INV-010).', build: function () { return mkList(TEN); } },
  C: { name: 'Preset C — Condition Testing', purpose: 'AND/OR conditions. Pending AND Amount>1000 → INV-C01, INV-C06, INV-C09 (3). Pending OR Overdue → 9 records (all except C04, C08, C11).', build: function () { return COND.map(function (c, i) { return { id: 'INV-' + c[0], customer: 'Condition Co ' + (i + 1), status: c[1], amount: c[2], type: 'Invoice', invoiceDate: addDays('2026-09-01', i), dueDate: addDays('2026-10-01', i), method: PM[i % 5], description: 'Condition test record ' + c[0] }; }); } },
  D: { name: 'Preset D — Twenty-Five Invoices', purpose: 'Pagination: 25 records = 5 pages of 5, 3 of 10, 2 of 20 (INV-D01 … INV-D25).', build: function () { var out = []; for (var i = 1; i <= 25; i++) out.push({ id: 'INV-D' + pad(i, 2), customer: CUST2[i % 12], status: ['Pending', 'Paid', 'Overdue'][i % 3], amount: 400 + ((i * 379) % 4600) - (((i * 379) % 4600) % 10), type: 'Invoice', invoiceDate: addDays('2026-08-01', i * 2), dueDate: addDays('2026-08-31', i * 2), method: PM[i % 5], description: DESC[i % 5] }); return out; } },
  E: { name: 'Preset E — Missing Data', purpose: 'Empty descriptions, missing dates, payment method, document type, zero amount (INV-E01 … INV-E08).', build: function () {
    var b = function (n, o) { var r = { id: 'INV-E' + pad(n, 2), customer: 'Sparse Customer ' + n, status: ['Pending', 'Paid', 'Overdue'][n % 3], amount: 700 + n * 110, type: 'Invoice', invoiceDate: addDays('2026-09-01', n), dueDate: addDays('2026-10-01', n), method: PM[n % 5], description: 'Complete record' }; for (var k in o) r[k] = o[k]; return r; };
    return [b(1), b(2, { description: '' }), b(3, { dueDate: '' }), b(4, { invoiceDate: '', dueDate: '' }), b(5, { method: '' }), b(6, { description: '', method: '', dueDate: '' }), b(7, { amount: 0 }), b(8, { type: '' })]; } },
  F: { name: 'Preset F — Duplicate-Looking Records', purpose: 'Near-identical customers, amounts and dates with unique IDs (INV-F01 … INV-F08).', build: function () {
    var names = ['Acme Supply Co', 'Acme Supply Co.', 'ACME Supply Co', 'Acme Supply Co', 'Acme Supplies Co', 'Acme Supply Co', 'Acme  Supply Co', 'Acme Supply Co'];
    return names.map(function (c, i) { return { id: 'INV-F' + pad(i + 1, 2), customer: c, status: i === 3 ? 'Paid' : 'Pending', amount: i === 5 ? 1250 : 1200, type: 'Invoice', invoiceDate: '2026-09-01', dueDate: '2026-10-01', method: 'Bank Transfer', description: 'Monthly supply of office materials' }; }); } }
};

var SCEN = [
  { k: 'noDownload', t: 'One invoice has no download button', d: 'The Download PDF button is omitted (list views and detail page) for the 3rd record in the dataset.', at: 2 },
  { k: 'slowDownload', t: 'One download takes three seconds', d: 'Clicking Download for the 2nd record starts the file 3 seconds later.', at: 1 },
  { k: 'failDownload', t: 'One download fails', d: 'Download for the 4th record shows an error alert and produces no file.', at: 3 },
  { k: 'vanish', t: 'One record disappears after filtering', d: 'The 5th record is hidden whenever any filter is applied, even if it matches.', at: 4 },
  { k: 'missingAmount', t: 'One invoice has a missing amount', d: 'The 6th record has no amount (blank cell; "N/A" in the PDF).', at: 5 },
  { k: 'emptyStatus', t: 'One invoice has an empty status', d: 'The 7th record has an empty status.', at: 6 },
  { k: 'sortFlip', t: 'Sorting changes between actions', d: 'After every successful download the list order reverses, so record positions shift mid-loop.' },
  { k: 'delayedDetail', t: 'A detail page has a delayed load', d: 'Invoice detail content appears 2.5 seconds after the route loads.' },
  { k: 'returnFiltered', t: 'Detail page returns to the filtered collection', d: 'ON (default): "Return to Invoices" restores the exact list URL. OFF: it goes to the unfiltered default list.' },
  { k: 'duplicateCustomer', t: 'A record has a duplicate customer name', d: 'The 8th record gets the same customer name as the 1st record.' },
  { k: 'longDescription', t: 'One record contains a long description', d: 'The 9th record has a ~550 character description.', at: 8 },
  { k: 'specialChars', t: 'One record has special characters in its customer name', d: 'The 10th record customer is: ' + SPECIAL, at: 9 }
];

/* ---------- state ---------- */
function defaultScen() { var s = {}; SCEN.forEach(function (x) { s[x.k] = x.k === 'returnFiltered'; }); return s; }
function fresh() { return { base: PRESETS.seed.build(), preset: 'seed', scenarios: defaultScen(), log: [], downloads: [], selected: [], flip: false }; }
var S;
try { S = JSON.parse(ls.get(KEY)); } catch (e) { S = null; }
if (!S || !S.base) S = fresh();
S.scenarios = Object.assign(defaultScen(), S.scenarios || {});
function save() { ls.set(KEY, JSON.stringify(S)); }
function log(type, id, detail) { S.log.unshift({ t: new Date().toISOString(), type: type, id: id || '', detail: detail || '' }); if (S.log.length > 500) S.log.length = 500; save(); }

function data() {
  var b = S.base.map(function (r) { return Object.assign({}, r); }), n = b.length, sc = S.scenarios;
  if (!n) return b;
  var at = function (i) { return b[Math.min(i, n - 1)]; };
  if (sc.noDownload) at(2).noDownload = true;
  if (sc.slowDownload) at(1).slow = true;
  if (sc.failDownload) at(3).fail = true;
  if (sc.vanish) at(4).vanish = true;
  if (sc.missingAmount) at(5).amount = null;
  if (sc.emptyStatus) at(6).status = '';
  if (sc.duplicateCustomer) at(7).customer = b[0].customer;
  if (sc.longDescription) at(8).description = LONG;
  if (sc.specialChars) at(9).customer = SPECIAL;
  return b;
}
var find = function (id) { return data().find(function (r) { return r.id === id; }); };

/* ---------- PDF (hand-built, no dependencies) ---------- */
function pdfEsc(s) { return String(s == null ? '' : s).replace(/[\r\n\t]+/g, ' ').replace(/[^\x20-\xFF]/g, '?').replace(/[\\()]/g, '\\$&'); }
function wrap(t, n) { var w = String(t || '').split(/\s+/), out = [], c = ''; w.forEach(function (x) { if ((c + ' ' + x).trim().length > n) { out.push(c); c = x; } else c = (c + ' ' + x).trim(); }); if (c) out.push(c); return out; }
function lineItems(r) {
  if (r.amount == null) return [['Services rendered', 1, null], ['Materials', 1, null], ['Handling', 1, null]];
  var a = Math.round(r.amount * 100), i1 = Math.round(a * 0.6), i2 = Math.round(a * 0.3), i3 = a - i1 - i2;
  return [['Professional services', 1, i1 / 100], ['Materials and supplies', 1, i2 / 100], ['Handling and delivery', 1, i3 / 100]];
}
function makePdf(r) {
  var ops = [], na = function (v) { return v || 'N/A'; }, m = function (v) { return v == null ? 'N/A' : money(v); };
  var T = function (x, y, size, bold, text) { ops.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + x + ' ' + y + ' Td (' + pdfEsc(text) + ') Tj ET'); };
  T(50, 800, 18, 1, 'ReFlow Demo Trading Co.');
  T(50, 784, 9, 0, '100 Market Street, Springfield, USA  |  billing@demo.local  |  Tax ID 00-0000000');
  T(400, 800, 20, 1, (r.type || 'Invoice').toUpperCase());
  ops.push('0.8 w 50 772 m 545 772 l S');
  var y = 748;
  [['Invoice number', r.id], ['Customer', r.customer], ['Invoice date', na(r.invoiceDate)], ['Due date', na(r.dueDate)], ['Status', na(r.status)], ['Payment method', na(r.method)], ['Document type', na(r.type)]].forEach(function (p) { T(50, y, 11, 0, p[0] + ':'); T(170, y, 11, 1, p[1]); y -= 17; });
  y -= 10; ops.push('50 ' + (y + 6) + ' 495 20 re S');
  T(56, y, 10, 1, 'Description'); T(350, y, 10, 1, 'Qty'); T(400, y, 10, 1, 'Unit price'); T(480, y, 10, 1, 'Amount'); y -= 22;
  lineItems(r).forEach(function (li) { T(56, y, 10, 0, li[0]); T(350, y, 10, 0, String(li[1])); T(400, y, 10, 0, m(li[2])); T(480, y, 10, 0, m(li[2])); y -= 17; });
  ops.push('0.8 w 50 ' + (y + 8) + ' m 545 ' + (y + 8) + ' l S'); y -= 8;
  T(400, y, 12, 1, 'Total: ' + m(r.amount)); y -= 36;
  T(50, y, 11, 1, 'Notes'); y -= 15;
  var lines = wrap(r.description || 'N/A', 90); lines.slice(0, 10).forEach(function (l) { T(50, y, 10, 0, l); y -= 13; });
  if (lines.length > 10) T(50, y, 10, 0, '...');
  T(50, 40, 8, 0, 'Generated by ReFlow Test Portal - dummy data for automation testing only.');
  var content = ops.join('\n');
  var objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream'];
  var out = '%PDF-1.4\n', off = [];
  objs.forEach(function (o, i) { off.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  var x = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + off.map(function (o) { return String(o).padStart(10, '0') + ' 00000 n \n'; }).join('') + 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + x + '\n%%EOF';
  var u = new Uint8Array(out.length); for (var i = 0; i < out.length; i++) u[i] = out.charCodeAt(i) & 255;
  return u;
}

/* ---------- downloads ---------- */
function toast(msg, kind) { var t = $('#toast'); t.className = 'toast show ' + (kind || ''); t.setAttribute('role', kind === 'error' ? 'alert' : 'status'); t.textContent = msg; clearTimeout(toast.h); toast.h = setTimeout(function () { t.className = 'toast'; }, 4000); }
function download(id) {
  var r = find(id);
  if (!r) { toast('Invoice ' + id + ' not found', 'error'); return; }
  if (r.noDownload) return;
  var go = function () {
    if (r.fail) { log('download_failed', id, 'Simulated server error'); toast('Download failed for ' + id + ': server error (simulated)', 'error'); return; }
    var blob = new Blob([makePdf(r)], { type: 'application/pdf' }), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = id + '.pdf'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);

  var names = Object.keys(map).sort(nat);
  return shell('customers', '<h1>Customers</h1><p class="muted">' + names.length + ' customers in the current dataset</p><div class="tablewrap"><table class="grid" data-testid="customer-table"><thead><tr><th>Customer</th><th class="num">Invoices</th><th class="num">Total billed</th><th>Actions</th></tr></thead><tbody>' +
    names.map(function (n, i) { return '<tr class="record" data-testid="customer-row-' + (i + 1) + '"><th scope="row">' + esc(n) + '</th><td class="num">' + map[n].n + '</td><td class="num">' + money(map[n].sum) + '</td><td><a class="btn" href="' + esc('?route=invoices&customer=' + encodeURIComponent(n) + '&view=table') + '" aria-label="View invoices for ' + esc(n) + '">View invoices</a></td></tr>'; }).join('') + '</tbody></table></div>');
}
function downloadsPage() {
  var counts = {}; S.downloads.forEach(function (d) { counts[d.id] = (counts[d.id] || 0) + 1; });
  var dups = Object.keys(counts).filter(function (k) { return counts[k] > 1; });
  return shell('downloads', '<h1>Download Center</h1><p class="muted">Every PDF successfully served by this portal. Failed downloads appear in the Activity Log only.</p>' +
    '<div class="stats"><div class="stat"><span class="muted">Total downloads</span><b data-testid="dl-total">' + S.downloads.length + '</b></div><div class="stat"><span class="muted">Unique invoices</span><b data-testid="dl-unique">' + Object.keys(counts).length + '</b></div><div class="stat"><span class="muted">Invoices downloaded more than once</span><b data-testid="dl-dups">' + dups.length + '</b></div></div>' +
    '<div class="toolbar"><span class="muted">' + (dups.length ? 'Duplicates: ' + esc(dups.join(', ')) : 'No duplicate downloads.') + '</span><button type="button" id="clearDownloads" class="btn">Clear download history</button></div>' +
    '<div class="tablewrap"><table class="grid"><thead><tr><th>Time</th><th>Invoice</th><th>File</th><th class="num">Times downloaded</th></tr></thead><tbody>' +
    (S.downloads.length ? S.downloads.map(function (d) { return '<tr><td>' + esc(ts(d.t)) + '</td><td>' + esc(d.id) + '</td><td>' + esc(d.file) + '</td><td class="num">' + counts[d.id] + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="muted">No downloads yet.</td></tr>') + '</tbody></table></div>');
}
function activityPage() {
  return shell('activity', '<h1>Activity Log</h1><p class="muted">Events recorded by this portal itself. This is not ReFlow\'s execution log — compare the two to check what the browser really did.</p><div class="toolbar"><span class="muted">' + S.log.length + ' events (newest first, max 500)</span><button type="button" id="clearLog" class="btn">Clear log</button></div>' +
    '<div class="tablewrap"><table class="grid" data-testid="activity-table"><thead><tr><th>Timestamp</th><th>Event</th><th>Record</th><th>Details</th></tr></thead><tbody>' +
    (S.log.length ? S.log.map(function (e) { return '<tr><td>' + esc(ts(e.t)) + '</td><td>' + esc(e.type) + '</td><td>' + esc(e.id) + '</td><td>' + esc(e.detail) + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="muted">No events yet.</td></tr>') + '</tbody></table></div>');
}
function testDataPage() {
  var q = Q(), loaded = q.get('loaded');
  return shell('testdata', '<h1>Test Data</h1><p class="muted">Loading a preset replaces the dataset with a deterministic starting state and clears selections and sort-flip. Activity log and download history are kept.</p>' +
    (loaded && PRESETS[loaded] ? '<div class="okmsg" role="status" data-testid="reset-success">Dataset loaded: ' + esc(PRESETS[loaded].name) + '</div>' : '') +
    '<div class="panel"><b>Current dataset:</b> <span data-testid="current-dataset">' + esc(PRESETS[S.preset].name) + '</span> — ' + S.base.length + ' records <button type="button" class="btn" data-load-preset="' + S.preset + '" aria-label="Reset current dataset" style="margin-left:10px">Reset current dataset</button></div>' +
    '<div id="confirmBox" class="dlg" role="alertdialog" aria-labelledby="cbTitle" hidden><b id="cbTitle">Confirm dataset reset</b><p id="cbText"></p><button type="button" id="confirmReset" class="btn danger" aria-label="Confirm reset">Confirm reset</button> <button type="button" id="cancelReset" class="btn" aria-label="Cancel reset">Cancel</button></div>' +
    '<div class="presets">' + Object.keys(PRESETS).map(function (k) { var p = PRESETS[k]; return '<div class="panel" style="margin:0" data-testid="preset-' + k + '"><h2>' + esc(p.name) + '</h2><p class="muted">' + esc(p.purpose) + '</p><p>' + p.build().length + ' records</p><button type="button" class="btn primary" data-load-preset="' + k + '" aria-label="Load ' + esc(p.name) + '">Load preset</button></div>'; }).join('') + '</div>');
}
function scenariosPage() {
  var n = S.base.length, tg = function (i) { return S.base[Math.min(i, n - 1)] ? S.base[Math.min(i, n - 1)].id : '—'; };
  return shell('scenarios', '<h1>Test Scenarios</h1><p class="muted">Deterministic switches — nothing fails unless you turn it on. Targets are chosen by position in the current dataset (datasets with fewer records fall back to the last record).</p>' +
    '<div class="toolbar"><span></span><button type="button" id="disableAll" class="btn">Disable all (keep “returns to filtered collection” on)</button></div><div class="panel">' +
    SCEN.map(function (s, i) { return '<div class="switch"><input type="checkbox" id="sc-' + s.k + '" data-scenario="' + s.k + '"' + (S.scenarios[s.k] ? ' checked' : '') + ' aria-label="' + esc(s.t) + '"><label for="sc-' + s.k + '" style="color:inherit;font-size:14px"><b>' + (i + 1) + '. ' + esc(s.t) + '</b><span class="muted">' + esc(s.d) + '</span>' + (s.at != null && s.k !== 'longDescription' && s.k !== 'specialChars' || ['longDescription', 'specialChars'].indexOf(s.k) >= 0 ? ' <span class="tag">target: ' + esc(tg(s.at != null ? s.at : (s.k === 'duplicateCustomer' ? 7 : 0))) + '</span>' : '') + '</label></div>'; }).join('') + '</div>');
}

/* ---------- router ---------- */
function mount(html) { $('#app').innerHTML = html; }
function main() {
  var q = Q(), route = q.get('route') || 'dashboard', authed = !!ls.get(SESSION);
  if (route === 'login') { if (authed) { location.replace('?route=dashboard'); return; } mount(loginPage()); return; }
  if (!authed) { location.replace('?route=login'); return; }
  var pages = { dashboard: dashboardPage, invoices: invoicesPage, invoice: invoicePage, customers: customersPage, downloads: downloadsPage, activity: activityPage, testdata: testDataPage, scenarios: scenariosPage };
  if (!pages[route]) route = 'dashboard';
  mount(pages[route]());
  if (route === 'invoices') { log('open_collection', '', location.search); drawCollection(); }
}

/* ---------- events ---------- */
var pendingPreset = null;
document.addEventListener('click', function (e) {
  var t = e.target, el;
  if ((el = t.closest('[data-download]'))) { e.preventDefault(); download(el.getAttribute('data-download')); return; }
  if ((el = t.closest('a[data-log]'))) log(el.getAttribute('data-log'), el.getAttribute('data-rid') || '', el.getAttribute('data-detail') || '');
  if (t.closest('#logout')) { log('logout'); ls.del(SESSION); location.href = '?route=login'; return; }
  if (t.closest('[data-action=more]')) { moreN++; log('load_more', '', 'batch ' + moreN); drawCollection(); return; }
  if ((el = t.closest('[data-load-preset]'))) { pendingPreset = el.getAttribute('data-load-preset'); $('#cbText').textContent = 'Replace the current dataset with “' + PRESETS[pendingPreset].name + '”? Selections and sort-flip state will be cleared.'; $('#confirmBox').hidden = false; return; }
  if (t.closest('#cancelReset')) { pendingPreset = null; $('#confirmBox').hidden = true; return; }
  if (t.closest('#confirmReset') && pendingPreset) { var k = pendingPreset; S.base = PRESETS[k].build(); S.preset = k; S.selected = []; S.flip = false; log('reset_dataset', '', PRESETS[k].name); location.href = '?route=testdata&loaded=' + k; return; }
  if (t.closest('#bulkDownload')) { S.selected.slice().forEach(function (id, i) { setTimeout(function () { download(id); }, i * 600); }); if (!S.selected.length) toast('No invoices selected', 'error'); return; }
  if (t.closest('#clearLog')) { S.log = []; save(); main(); return; }
  if (t.closest('#clearDownloads')) { S.downloads = []; save(); main(); return; }
  if (t.closest('#disableAll')) { S.scenarios = defaultScen(); S.flip = false; save(); main(); return; }
});
document.addEventListener('change', function (e) {
  var t = e.target, id;
  if ((id = t.getAttribute && t.getAttribute('data-select'))) { var i = S.selected.indexOf(id); if (t.checked && i < 0) S.selected.push(id); if (!t.checked && i >= 0) S.selected.splice(i, 1); save(); var c = $('#selCount'); if (c) c.textContent = S.selected.length + ' selected'; return; }
  if (t.getAttribute && t.getAttribute('data-scenario')) { S.scenarios[t.getAttribute('data-scenario')] = t.checked; S.flip = false; save(); return; }
  if (t.getAttribute && t.getAttribute('data-auto')) { var f = $('#filterForm'); f.setAttribute('data-src', t.getAttribute('data-auto')); f.requestSubmit(); }
});
document.addEventListener('submit', function (e) {
  var f = e.target;
  if (f.id === 'loginForm') {
    e.preventDefault();
    var em = f.email.value.trim(), pw = f.password.value;
    if (!em || !pw) { mount(loginPage('Email and password are required.')); return; }
    if (em !== 'admin@demo.local' || pw !== 'Demo123!') { mount(loginPage('Invalid email or password.')); return; }
    ls.set(SESSION, '1'); log('login', '', em); location.href = '?route=dashboard'; return;
  }
  if (f.id === 'filterForm') {
    e.preventDefault();
    var fd = new FormData(f), p = new URLSearchParams(), cur = Q();
    p.set('route', 'invoices');
    fd.forEach(function (v, k) { v = String(v).trim(); if (v === '') return; if (/^c\d[fo]$/.test(k)) return; p.set(k, v); });
    for (var i = 1; i <= 3; i++) { var fl = fd.get('c' + i + 'f'), v1 = String(fd.get('c' + i + 'v') || '').trim(), v2 = String(fd.get('c' + i + 'v2') || '').trim(); if (fl && (v1 || v2)) { p.set('c' + i + 'f', fl); p.set('c' + i + 'o', fd.get('c' + i + 'o')); } }
    if (p.get('logic') === 'and' && !Array.from(p.keys()).some(function (k) { return /^c\d/.test(k); })) p.delete('logic');
    var src = f.getAttribute('data-src') || 'filters'; f.removeAttribute('data-src');
    var type = { sort: 'sort', per: 'change_page_size', mode: 'change_mode' }[src] || 'apply_filters';
    if (src === 'mode') cur.set('mode', p.get('mode') || 'pages');
    log(type, '', p.toString());
    location.href = '?' + p.toString();
  }
});

window.RTP = { makePdf: makePdf, data: data, filterRows: function (qs) { return filterRows(new URLSearchParams(qs)); }, PRESETS: PRESETS };
main();
})();
</script>
</body>
</html>
